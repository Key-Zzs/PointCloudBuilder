schema_version: pointcloud-builder.rig.v1
output_frame: workspace
cameras:
  - name: camera_a
    enabled: true
    source:
      type: camera_rig_replay
      capture_artifact: path/to/camera_a/capture
      provision_artifact: path/to/camera_a/provision
    depth:
      mode: native
    pipeline_config: null
    local_crop:
      enabled: false
  - name: camera_b
    enabled: true
    source:
      type: camera_rig_replay
      capture_artifact: path/to/camera_b/capture
      provision_artifact: path/to/camera_b/provision
    depth:
      mode: native
    pipeline_config: null
    local_crop:
      enabled: false
timing:
  mode: nearest_host_timestamp
  reference_camera: camera_a
  maximum_skew_ms: 33.4
workspace_crop:
  enabled: true
  x: [-1.0, 1.0]
  y: [-1.0, 1.0]
  z: [-0.2, 2.0]
fusion:
  enabled: true
  voxel_size_m: 0.01
  origin: [-1.0, -1.0, -0.2]
  deterministic: true
sampling:
  enabled: true
  mode: voxel_fps
  num_points: 1024
  voxel_size: 0.01
  deterministic: true
  seed: 23
