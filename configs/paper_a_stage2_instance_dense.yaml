# Paper A Stage 2 only.  This profile is offline annotation geometry, never a
# DP3 policy observation or real-time SAM inference configuration.
device: cuda

pipeline:
  profile: instance_dense

# Optional PCB execution boundary.  Paper A always materializes SAM output in
# an isolated-environment sidecar; this does not import SAM in dp3/PCB.
segmentation:
  execution: sidecar

camera:
  name: head
  depth_scale: 1.0
  aligned_depth_to_color: false
  color_intrinsics:
    width: 640
    height: 480
    fx: 606.177490234375
    fy: 606.6356201171875
    cx: 320.8212585449219
    cy: 256.06561279296875
  depth_intrinsics:
    width: 640
    height: 480
    fx: 392.5011901855469
    fy: 392.5011901855469
    cx: 316.7951354980469
    cy: 235.7994384765625
  depth_to_color_extrinsics:
    rotation_matrix_row_major:
      - [0.9998224377632141, -0.018843574449419975, 0.0002598218561615795]
      - [0.018843060359358788, 0.9998207092285156, 0.0018564234487712383]
      - [-0.00029475693008862436, -0.0018511980306357145, 0.9999982714653015]
    translation_m: [0.015109467320144176, -0.00043273851042613387, 0.0002704341313801706]

pointcloud:
  use_rgb: false
  output_format: xyz
  rgb_mapping: project_depth_to_color

crop:
  enabled: true
  frame: camera
  x: [-0.4, 0.4]
  y: [-0.8, 0.2]
  z: [0.3, 1.2]

support_plane:
  enabled: true
  model_source: estimate_episode
  distance_threshold_m: 0.005
  ransac_threshold_m: 0.008
  ransac_iterations: 256
  representative_frames: 9

# This is the policy-view sampling path used only by Mode2 diagnostics.
sampling:
  enabled: true
  mode: fps
  num_points: 2048
  voxel_size: 0.01
  seed: 42
  deterministic: true
  pad_mode: repeat

instance_sampling:
  enabled: true
  mode: voxel_fps
  num_points: 256
  voxel_size: 0.005
  seed: 20260818
  deterministic: true
  pad_mode: repeat

# Applied only while lifting SAM masks into instance geometry.  This is a
# color-camera-view z-buffer tolerance in metres; legacy point-cloud output is
# unchanged.
visibility_filter:
  enabled: true
  epsilon_z: 0.005

depth_source:
  mode: ffs_stereo
  ffs:
    backend: tensorrt_plugin
    artifact_id: fp16_o3
    left_key: left_ir
    right_key: right_ir
    engine_path: /home/deepcybo/workspace/3D-Diffusion-Policy/PointCloudBuilder/ffs_reproduction/artifacts/tensorrt_plugin_fp16_o3.engine
    plugin_library_path: /home/deepcybo/workspace/3D-Diffusion-Policy/PointCloudBuilder/ffs_reproduction/build/libffs_gwc_plugin.so
    manifest_path: /home/deepcybo/workspace/3D-Diffusion-Policy/PointCloudBuilder/ffs_reproduction/artifacts/tensorrt_plugin_fp16_o3.manifest.json
    config_path: /home/deepcybo/workspace/3D-Diffusion-Policy/PointCloudBuilder/ffs_reproduction/artifacts/tensorrt_plugin_fp16_o3.yaml
    calibration_path: /home/deepcybo/.cache/huggingface/lerobot/flexiv_dual_arm_3d/pick_place_20260717_v01/meta/realsense_calibration.json
    calibration_camera: head
    exact_cache_root: /home/deepcybo/.cache/paper_a_teb/stage2/pick_place_20260717_v01/ffs_exact_cache
    width: 640
    height: 480
    max_disp: 192
    valid_iters: 8
    precision: fp16
    builder_optimization_level: 3
    workspace_gib: 8.0
    baseline_m: 0.05006292834877968
    rectification_mode: auto
    remove_invisible: true
    min_disparity_px: 0.001
    min_depth_m: 0.0
