[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-builder"
version = "0.2.0"
description = "Reusable PyTorch RGB-D to point-cloud builder for robot learning pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "PointCloudBuilder contributors"}
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=7.0",
  "scipy>=1.10,<2",
  "imageio>=2.31",
  "onnx==1.18.0",
  "opencv-contrib-python-headless==4.14.0.94",
  "omegaconf==2.3.0",
  "Pillow>=9.0",
  "timm==1.0.28",
]
viz = [
  "open3d>=0.18",
]
rerun = [
  "rerun-sdk==0.36.3",
]
tsdf = [
  "open3d==0.19.0",
]
reconstruction = [
  "scipy>=1.10,<2",
  "opencv-contrib-python-headless==4.14.0.94",
  "pyrealsense2==2.58.3.10794",
  "open3d==0.19.0",
  "rerun-sdk==0.36.3",
  "timm==1.0.28",
  "omegaconf==2.3.0",
  "onnx==1.18.0",
  "onnxscript==0.5.6",
  "imageio==2.37.3",
  "psutil>=6,<8",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
include = ["pointcloud_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
